name: Validate and publish gallery
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: WindyWin/vpet-agent-pet
          # Includes tool cues and bedtime art used by the reviewed Doro pack.
          ref: 7d0bbc1fb670dcf84b84c55261f3c954d6492dde
          path: validator
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libarchive-dev libgl-dev libx11-dev libxtst-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          cache: true
      - name: Build validator
        run: |
          cmake -S validator/starter -B validator/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build validator/build --target agent-pet -j 2
      - name: Validate sources and import every pack
        env:
          GALLERY_REPO: ${{ github.repository }}
          GALLERY_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
        run: |
          python scripts/verify_assets.py
          python scripts/build_gallery.py --app validator/build/agent-pet --repository "$GALLERY_REPO" --tag "$GALLERY_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: dist/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packs
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gallery
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
